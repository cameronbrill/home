app            = "home-dfqtra"
primary_region = "lax"

[build]
  image = "registry.fly.io/home-dfqtra:latest"

[env]
  PYTHONUNBUFFERED        = "1"
  PYTHONDONTWRITEBYTECODE = "1"

[vm]
  memory_mb = 512
  cpu_kind  = "shared"
  cpus      = 1

# This worker exposes no network service. Fly monitors the entrypoint process
# directly and restarts it if it exits; entrypoint.sh execs Python to preserve
# signal delivery and process health.
[[restart]]
  policy = "always"
