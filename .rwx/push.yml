on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.github.pull_request.pull_request.head.ref }}

# Pull request and CLI runs only publish immutable commit tags. Production
# deploys live in main.yml, which has no CLI or pull request trigger.
tasks:
  - key: ci
    call: ${{ run.dir }}/ci.yml
    init:
      commit-sha: ${{ init.commit-sha }}

  - key: build-image
    call: ${{ run.dir }}/build.yml
    init:
      commit-sha: ${{ init.commit-sha }}

  - key: publish-image
    after: [ci, build-image]
    call: ${{ run.dir }}/publish.yml
    init:
      image-task-id: ${{ tasks.build-image.tasks.image.id }}
      branch: ${{ init.branch }}
      commit-sha: ${{ init.commit-sha }}
      add-latest: false
